<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FORMOCRACY — 第十二区人物档案</title>
  <!--
    已确认的设计假设：
    - 这是一份给创作、叙事与美术团队共同使用的 18 人角色档案册。
    - 玩家主角姓名由开局输入，林默仅为 NPC。
    - 视觉沿用用户提供的 A4 IP 平台原型：编辑出版感、大留白、细分隔线、章节编号。
    - 世界保持制度灰与旧纸张气质，每个角色只使用一组强绑定的人格色。
    - 本页不依赖远程字体或网络资源，可直接通过 file:// 打开并打印为 PDF。
  -->
  <style>
    @font-face {
      font-family: "Fusion Pixel";
      src: url("../../assets/fonts/fusion_pixel/fusion-pixel-12px-proportional-zh_hans.ttf") format("truetype");
      font-display: swap;
    }

    :root {
      --paper: #f2eee4;
      --paper-deep: #e8e0d0;
      --ink: #24231f;
      --body: #504d46;
      --quiet: #918b81;
      --hairline: #cfc7b8;
      --screen: #312f2a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      background: var(--screen);
    }

    body {
      color: var(--ink);
      font-family: "Hiragino Sans GB", "Heiti SC", "Noto Sans CJK SC", sans-serif;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    .page {
      width: 210mm;
      height: 297mm;
      margin: 12mm auto;
      padding: 16mm 18mm 15mm;
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(rgba(36, 35, 31, 0.018) 1px, transparent 1px),
        var(--paper);
      background-size: 100% 8px;
      page-break-after: always;
      break-after: page;
      box-shadow: 0 8px 42px rgba(0, 0, 0, 0.26);
    }

    .page:last-child {
      page-break-after: auto;
      break-after: auto;
    }

    .page::after {
      content: "";
      position: absolute;
      inset: 8mm;
      border: 0.35mm solid color-mix(in srgb, var(--accent, var(--hairline)) 28%, transparent);
      pointer-events: none;
    }

    .folio {
      position: absolute;
      left: 18mm;
      right: 18mm;
      bottom: 8mm;
      display: flex;
      justify-content: space-between;
      padding-top: 2.5mm;
      border-top: 0.25mm solid var(--hairline);
      color: var(--quiet);
      font: 7.5pt/1.2 "Fusion Pixel", monospace;
      letter-spacing: 0.08em;
    }

    .eyebrow {
      color: var(--quiet);
      font: 7.5pt/1.2 "Fusion Pixel", monospace;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .cover {
      --accent: #3f5fa8;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .cover::before {
      content: "";
      position: absolute;
      top: 16mm;
      width: 12mm;
      height: 0.7mm;
      background: var(--ink);
    }

    .cover h1 {
      margin: 10mm 0 4mm;
      font-family: "Songti SC", "Noto Serif CJK SC", serif;
      font-size: 29pt;
      line-height: 1.28;
      letter-spacing: 0.08em;
    }

    .cover .subtitle {
      color: var(--quiet);
      font-size: 9pt;
      letter-spacing: 0.14em;
    }

    .cover .statement {
      max-width: 120mm;
      margin-top: 18mm;
      padding: 6mm 0;
      border-top: 0.25mm solid var(--hairline);
      border-bottom: 0.25mm solid var(--hairline);
      color: var(--body);
      font-family: "Songti SC", "Noto Serif CJK SC", serif;
      font-size: 10.5pt;
      line-height: 1.9;
    }

    .spectrum {
      width: 148mm;
      height: 4mm;
      display: grid;
      grid-template-columns: repeat(18, 1fr);
      margin-top: 16mm;
      border: 0.25mm solid rgba(36, 35, 31, 0.2);
    }

    .spectrum span {
      background: var(--swatch);
    }

    .cover .meta {
      position: absolute;
      bottom: 16mm;
      left: 18mm;
      right: 18mm;
      display: flex;
      justify-content: space-between;
      color: var(--quiet);
      font: 7pt/1.2 "Fusion Pixel", monospace;
      letter-spacing: 0.08em;
    }

    .index-page {
      --accent: #6c665d;
    }

    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding-bottom: 4mm;
      border-bottom: 0.45mm solid var(--ink);
    }

    .page-header h2 {
      margin-top: 2mm;
      font-family: "Songti SC", "Noto Serif CJK SC", serif;
      font-size: 21pt;
      letter-spacing: 0.04em;
    }

    .classification {
      min-width: 34mm;
      padding: 2.2mm 3mm;
      border: 0.4mm solid var(--accent);
      color: var(--accent);
      text-align: center;
      font: 7.5pt/1.2 "Fusion Pixel", monospace;
      letter-spacing: 0.16em;
      transform: rotate(-1.5deg);
    }

    .index-intro {
      max-width: 130mm;
      margin: 5mm 0 7mm;
      color: var(--body);
      font-size: 9.5pt;
      line-height: 1.8;
    }

    .cast-groups {
      display: grid;
      grid-template-columns: 1fr 0.78fr;
      gap: 7mm;
    }

    .group-title {
      display: flex;
      align-items: baseline;
      gap: 3mm;
      margin-bottom: 3mm;
      font-family: "Songti SC", serif;
      font-size: 12pt;
    }

    .group-title b {
      color: var(--quiet);
      font: 7pt/1 "Fusion Pixel", monospace;
    }

    .cast-list {
      border-top: 0.25mm solid var(--hairline);
    }

    .cast-row {
      display: grid;
      grid-template-columns: 4mm 20mm 1fr;
      gap: 2.5mm;
      align-items: center;
      min-height: 11mm;
      border-bottom: 0.25mm solid var(--hairline);
      font-size: 8.3pt;
    }

    .cast-dot {
      width: 3mm;
      height: 3mm;
      background: var(--row-accent);
      border-radius: 50%;
    }

    .cast-row strong {
      font-family: "Songti SC", serif;
      font-size: 9.5pt;
    }

    .cast-row span:last-child {
      color: var(--body);
    }

    .relation-box {
      margin-top: 7mm;
      padding: 4.5mm 5mm;
      border: 0.25mm solid var(--hairline);
      background: rgba(255, 255, 255, 0.24);
    }

    .relation-box h3 {
      margin-bottom: 2.5mm;
      font-family: "Songti SC", serif;
      font-size: 11pt;
    }

    .relation-box ol {
      padding-left: 4mm;
    }

    .relation-box li {
      margin-bottom: 1.6mm;
      color: var(--body);
      font-size: 8.1pt;
      line-height: 1.55;
    }

    .character-page {
      --accent: #3f5fa8;
    }

    .character-head {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: end;
      padding-bottom: 4.5mm;
      border-bottom: 0.55mm solid var(--accent);
    }

    .character-head h2 {
      margin-top: 1.5mm;
      font-family: "Songti SC", "Noto Serif CJK SC", serif;
      font-size: 28pt;
      line-height: 1.1;
      letter-spacing: 0.08em;
    }

    .character-head .latin {
      margin-top: 1mm;
      color: var(--quiet);
      font: 7.5pt/1 "Fusion Pixel", monospace;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .age-badge {
      min-width: 25mm;
      padding: 2.8mm;
      border: 0.4mm solid var(--accent);
      color: var(--accent);
      text-align: center;
    }

    .age-badge strong {
      display: block;
      font-family: "Songti SC", serif;
      font-size: 20pt;
      line-height: 1;
    }

    .age-badge span {
      font: 7pt/1.2 "Fusion Pixel", monospace;
      letter-spacing: 0.12em;
    }

    .character-body {
      display: grid;
      grid-template-columns: 70mm 1fr;
      gap: 8mm;
      height: 222mm;
      padding-top: 6mm;
    }

    .portrait-column {
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .portrait-frame {
      height: 166mm;
      position: relative;
      overflow: hidden;
      border: 0.25mm solid color-mix(in srgb, var(--accent) 35%, var(--hairline));
      background: var(--paper-deep);
    }

    .portrait-frame::before {
      content: "";
      position: absolute;
      inset: 0;
      border-top: 5mm solid var(--accent);
      opacity: 0.11;
      pointer-events: none;
    }

    .portrait-frame img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      image-rendering: pixelated;
    }

    .id-strip {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 3mm;
      margin-top: 3mm;
      padding: 3mm 0;
      border-top: 0.25mm solid var(--hairline);
      border-bottom: 0.25mm solid var(--hairline);
    }

    .id-strip p {
      color: var(--body);
      font-size: 8pt;
    }

    .id-strip b {
      display: block;
      color: var(--quiet);
      font: 6.8pt/1.2 "Fusion Pixel", monospace;
      letter-spacing: 0.08em;
    }

    .role-stamp {
      align-self: center;
      padding: 1.7mm 2.3mm;
      border: 0.35mm solid var(--accent);
      color: var(--accent);
      font: 7pt/1 "Fusion Pixel", monospace;
      letter-spacing: 0.08em;
      transform: rotate(-1.2deg);
    }

    .palette {
      margin-top: 4mm;
    }

    .palette h3 {
      margin-bottom: 2mm;
      color: var(--quiet);
      font: 7pt/1.2 "Fusion Pixel", monospace;
      letter-spacing: 0.13em;
    }

    .swatch-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2mm;
    }

    .swatch {
      height: 15mm;
      padding: 2mm;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      border: 0.25mm solid rgba(36, 35, 31, 0.18);
      color: var(--swatch-text, #fff);
      background: var(--swatch);
      font: 6pt/1.2 "Fusion Pixel", monospace;
      letter-spacing: 0.04em;
    }

    .copy-column {
      min-height: 0;
    }

    .section-block {
      margin-bottom: 5mm;
    }

    .section-label {
      display: flex;
      align-items: baseline;
      gap: 2.5mm;
      margin-bottom: 1.8mm;
    }

    .section-label b {
      color: var(--accent);
      font: 7pt/1 "Fusion Pixel", monospace;
    }

    .section-label h3 {
      font-family: "Songti SC", serif;
      font-size: 11.5pt;
      letter-spacing: 0.04em;
    }

    .identity-line {
      padding: 3.5mm 4mm;
      border-left: 1.1mm solid var(--accent);
      background: color-mix(in srgb, var(--accent) 7%, transparent);
      font-family: "Songti SC", serif;
      font-size: 11pt;
      line-height: 1.75;
    }

    .story {
      color: var(--body);
      font-size: 9.1pt;
      line-height: 1.78;
      text-align: justify;
      text-wrap: pretty;
    }

    .visits {
      display: grid;
      grid-template-columns: 9mm 1fr;
      border-top: 0.25mm solid var(--hairline);
    }

    .visit {
      display: contents;
    }

    .visit b,
    .visit p {
      padding: 2.3mm 0;
      border-bottom: 0.25mm solid var(--hairline);
    }

    .visit b {
      color: var(--accent);
      font: 7pt/1.5 "Fusion Pixel", monospace;
    }

    .visit p {
      color: var(--body);
      font-size: 8.3pt;
      line-height: 1.5;
    }

    .quote {
      margin-top: 5mm;
      padding: 4mm 0 0 5mm;
      position: relative;
      border-top: 0.25mm solid var(--hairline);
      color: var(--ink);
      font-family: "Songti SC", serif;
      font-size: 10.5pt;
      line-height: 1.75;
    }

    .quote::before {
      content: "“";
      position: absolute;
      left: -1mm;
      top: 1mm;
      color: var(--accent);
      font-size: 24pt;
      line-height: 1;
    }

    @page {
      size: A4;
      margin: 0;
    }

    @media print {
      html,
      body {
        background: transparent;
      }

      .page {
        margin: 0;
        box-shadow: none;
      }
    }
  </style>
</head>
<body>
  <main id="dossier"></main>
  <script>
    const characters = [
      {
        id: "PERSON-LIN", file: "12-D/C01", name: "林默", latin: "LIN MO", age: 28,
        role: "回访核心", occupation: "市政信号维护员", citizen: "74-119-02",
        color: "#3F5FA8", colorName: "冷靛蓝", secondary: "#8797B9", forbidden: "#D9A441",
        image: "../../assets/characters/dossier/person_lin/concept.png",
        who: "一个习惯把情绪收进制服口袋里的年轻维修员；他申请与恋人共同生活，却拒绝解释自己曾经消失的三个月。",
        story: "林默在第十二区维护老旧信号灯和楼宇警报，工作记录稳定得近乎没有瑕疵。三个月前，他在一次夜间抢修后失踪，回来时只说自己被临时征调，系统中却找不到对应命令。沈青禾仍愿意与他共同生活，但两人递交的时间线存在细小差异。林默并非不知道真相；他害怕说出那段经历后，沈青禾会被一起写进需要“校正”的名单。",
        visits: ["提交共同居住配额变更，材料完整，态度克制。", "审批结果改变两人的住址记录，沈青禾开始单独来询问。", "承认失踪期间进入过日终验收机房，并见过玩家旧身份的编号。"],
        quote: "住址没有变。我们只是想让档案承认已经发生的生活。"
      },
      {
        id: "PERSON-ZHOU", file: "12-D/C02", name: "周循", latin: "ZHOU XUN", age: 44,
        role: "回访核心", occupation: "锅炉与管线维修工", citizen: "20-441-88",
        color: "#C78238", colorName: "熟赭橙", secondary: "#8E765F", forbidden: "#4E77A8",
        image: "../../assets/characters/dossier/person_zhou/concept.png",
        who: "一个把照护责任全部揽在自己身上的维修工；他说话温和，却正在被配给制度一点点耗空。",
        story: "周循负责住宅区的锅炉、供水阀和冬季管线，常在别人睡着后进入地下设备间。他与母亲杜春梅同住，后者需要持续用水服药，但两人的居住地址在一次街区重编后被系统拆成两个编号。周循不断递交临时水额申请，同时接私活补贴家用。他知道配给站的管线损耗被人为写低，却不愿举报蒋森，因为那些“损耗”实际流向了没有登记资格的住户。",
        visits: ["申请提高净水额度，身份记录与居住证明地址不一致。", "若被驳回，杜春梅停药；若获批，配给站开始追查异常用量。", "交出地下管线图，证明多名角色共享同一条被隐去的供水支线。"],
        quote: "表上写的是额度，回到家里，就是一个人今天能不能把药咽下去。"
      },
      {
        id: "PERSON-XU", file: "12-D/C03", name: "许桥", latin: "XU QIAO", age: 25,
        role: "回访核心", occupation: "区域文件递送员", citizen: "51-004-63",
        color: "#D35245", colorName: "朱砂红", secondary: "#9A756E", forbidden: "#74836B",
        image: "../../assets/characters/dossier/person_xu/concept.png",
        who: "一个把速度当作尊严的文件递送员；她急着证明自己还能工作，因此把尚未痊愈的伤藏在每一次奔跑里。",
        story: "许桥骑车穿行于第十二区各机构之间，熟悉每扇侧门和每个不在地图上的投递口。一次装配线事故中，她替唐霁完成紧急送件时受伤，诊疗站回执却因验收机时钟错误而在签发前就被判定过期。她害怕长期病假导致岗位注销，于是不断申请限制时段通行。她随身保留那张过期回执，因为背面的油印编号指向顾原隐瞒的事故名单。",
        visits: ["持过期回执申请医疗通行，表现得急躁且疼痛明显。", "审批决定影响伤势与工作资格，唐霁开始替她追查封存袋。", "公开事故当天的真实投递路线，把诊疗站、装配线与监察处连在一起。"],
        quote: "我不是要特殊照顾。我只想在还能走的时候，走到该去的地方。"
      },
      {
        id: "PERSON-MENG", file: "12-D/C04", name: "孟秋兰", latin: "MENG QIULAN", age: 48,
        role: "回访核心", occupation: "公共食堂配餐员", citizen: "46-208-71",
        color: "#D6A126", colorName: "藏红花黄", secondary: "#9D8658", forbidden: "#744A78",
        image: "../../assets/characters/dossier/person_meng/concept.png",
        who: "一个用重复日常抵抗行政遗忘的母亲；她每天多留一份饭，好像那个被注销的人仍会回来。",

        visits: ["申请延续家庭食品份额，系统显示家庭成员不存在。", "批准会触发冒领审查，驳回则让她失去唯一可持续查询的编号。", "她拿出二十一张退件回执，拼出事故后统一修改档案的时间窗口。"],
        quote: "只要窗口还肯退给我一张纸，就说明系统里还有地方记得他。"
      },
      {
        id: "PERSON-HE", file: "12-D/C05", name: "何芸", latin: "HE YUN", age: 34,
        role: "回访核心", occupation: "第七码头夜校教师", citizen: "65-331-09",
        color: "#2F9488", colorName: "孔雀青", secondary: "#7A9993", forbidden: "#A6443D",
        image: "../../assets/characters/dossier/person_he/concept.png",
        who: "一个语气温和、记忆锋利的夜校教师；她把被迁走的学生继续写在点名册里。",
        story: "何芸白天在仓库做统计，晚上为码头工人和孩子教授阅读。街区迁移后，管理局要求她删除九名“已转移”学生，她却在私人点名册中保留姓名，并让仍在附近的人代答到。她最初只申请夜间照明和教材配额，后来发现名册中的三个姓名同时出现在黎素修复的档案缺页中。何芸相信识字能让人看见制度如何改写自己，因此宁愿承担私设课程的风险。",
        visits: ["申请夜校照明配额，学生人数与官方名册不符。", "审批结果决定夜校是否继续，监察员魏岚开始旁听。", "交出私人点名册，证明“转移”记录与现实中的失踪并不相同。"],
        quote: "名字被划掉以后，更需要有人把它念出来。"
      },
      {
        id: "PERSON-DU", file: "12-D/C06", name: "杜春梅", latin: "DU CHUNMEI", age: 69,
        role: "回访核心", occupation: "退休电话接线员", citizen: "11-604-42",
        color: "#945B82", colorName: "李子紫", secondary: "#A4929C", forbidden: "#D49731",

        <p class="statement">制度以统一格式记录所有人；人却通过欲望、记忆、关系和颜色从格式里溢出。本册用于统一人物叙事、美术主色与跨日回访结构。</p>
        <div class="spectrum">${spectrum}</div>
        <div class="meta"><span>REALITY ADMINISTRATION / INTERNAL USE</span><span>REV. 01 · 2026</span></div>
      </section>`;

    const coreRows = characters.slice(0, 10).map(c => `
      <div class="cast-row" style="--row-accent:${c.color}">
        <i class="cast-dot"></i><strong>${c.name}</strong><span>${c.occupation}</span>
      </div>`).join("");

    const nodeRows = characters.slice(10).map(c => `
      <div class="cast-row" style="--row-accent:${c.color}">
        <i class="cast-dot"></i><strong>${c.name}</strong><span>${c.occupation}</span>
      </div>`).join("");

    const index = `
      <section class="page index-page">
        <header class="page-header">
          <div><div class="eyebrow">00 / CAST INDEX</div><h2>人物关系索引</h2></div>
          <div class="classification">内部创作资料</div>
        </header>
        <p class="index-intro">十名回访核心人物通过窗口案件反复出现；八名城市节点人物通过夜间地点、批注、电话、送达物与验收记录把案件连接起来。颜色代表人格，不代表阵营。</p>
        <div class="cast-groups">
          <section>
            <h3 class="group-title"><b>01</b> 回访核心 / 10</h3>
            <div class="cast-list">${coreRows}</div>
          </section>
          <section>
            <h3 class="group-title"><b>02</b> 城市节点 / 8</h3>
            <div class="cast-list">${nodeRows}</div>
          </section>
        </div>
        <section class="relation-box">
          <h3>关键关系链</h3>
          <ol>${relations.map(r => `<li>${r}</li>`).join("")}</ol>
        </section>
        <div class="folio"><span>FORMOCRACY / DISTRICT 12</span><span>02 / 20</span></div>
      </section>`;

    const pages = characters.map((c, i) => {
      const pageNo = String(i + 3).padStart(2, "0");
      return `
        <section class="page character-page" style="--accent:${c.color}">
          <header class="character-head">
            <div>
              <div class="eyebrow">${c.file} / ${c.id}</div>
              <h2>${c.name}</h2>
              <div class="latin">${c.latin}</div>
            </div>
            <div class="age-badge"><strong>${c.age}</strong><span>AGE / 年龄</span></div>
          </header>
          <div class="character-body">
            <aside class="portrait-column">
              <figure class="portrait-frame"><img src="${c.image}" alt="${c.name}人物立绘"></figure>
              <div class="id-strip">
                <p><b>职业 / OCCUPATION</b>${c.occupation}</p>
                <span class="role-stamp">${c.role}</span>
                <p><b>居民编号 / CITIZEN ID</b>${c.citizen}</p>
              </div>
              <section class="palette">
                <h3>PERSONALITY PALETTE / 人格色谱</h3>
                <div class="swatch-row">
                  <div class="swatch" style="--swatch:${c.color}"><b>主色</b>${c.color}<br>${c.colorName}</div>
                  <div class="swatch" style="--swatch:${c.secondary}"><b>辅助</b>${c.secondary}</div>
                  <div class="swatch" style="--swatch:${c.forbidden};--swatch-text:#fff"><b>禁用</b>${c.forbidden}</div>
                </div>
              </section>
            </aside>
            <article class="copy-column">
              <section class="section-block">
                <div class="section-label"><b>01</b><h3>这个人是谁</h3></div>
                <p class="identity-line">${c.who}</p>
              </section>
              <section class="section-block">
                <div class="section-label"><b>02</b><h3>背景故事</h3></div>
                <p class="story">${c.story}</p>
              </section>
              <section class="section-block">
                <div class="section-label"><b>03</b><h3>回访轨迹</h3></div>
                <div class="visits">
                  ${c.visits.map((v, n) => `<div class="visit"><b>0${n + 1}</b><p>${v}</p></div>`).join("")}
                </div>
              </section>
              <blockquote class="quote">${c.quote}”</blockquote>
            </article>
          </div>
          <div class="folio"><span>${c.file} / CONFIDENTIAL</span><span>${pageNo} / 20</span></div>
        </section>`;
    }).join("");

    dossier.innerHTML = cover + index + pages;
  </script>
</body>
</html>
